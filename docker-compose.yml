version: "3.9"

services:
  api:
   build: .
   ports:
    - "3000:3000"
   env_file:
    - .env
   environment:
    DB_HOST: postgres 
    DB_PORT: 5432
   depends_on:
    postgres:
     condition: service_healthy


  postgres:
   image: postgres:16-alpine
   environment:
    POSTGRES_USER: ${DB_USER}
    POSTGRES_PASSWORD: ${DB_PASSWORD}
    POSTGRES_DB: ${DB_NAME}
   ports:
    - "5432:5432"
   volumes:
    - dados_postgres:/var/lib/postgresql/data
    - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
   healthcheck:
    test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
    interval: 5s
    timeout: 5s
    retries: 5

volumes:
 dados_postgres:
  